[project]
name = "telegram-report-bot"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
# Only dependencies imported by the server scraper's regular runtime path.
main-runtime = [
    "apscheduler>=3.11.0",
    "aiohttp>=3.13.3",
    "beautifulsoup4>=4.14.3",
    "chardet>=5.2.0,<6.0.0",
    "holidays>=0.91",
    "loguru>=0.7.3",
    "lxml>=6.0.2",
    "pypdf>=6.0.0",
    "psycopg2-binary>=2.9.10",
    "playwright==1.64.0",
    "python-dotenv>=1.2.2",
    "python-telegram-bot>=22.6",
    "pytz>=2026.1.post1",
    "requests[socks]>=2.32.5",
    "wget>=3.2",
]
# Manual/legacy utilities retain their larger dependency set in developer
# environments, but are excluded from the production main-scraper image.
full-runtime = [
    { include-group = "main-runtime" },
    "aiosqlite>=0.22.1",
    "finvizfinance>=1.3.0",
    "google-generativeai>=0.8.6",
    "openpyxl>=3.1.5",
    "pandas>=3.0.1",
    "questionary>=2.1.1",
]

dev = [
    { include-group = "full-runtime" },
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pyyaml>=6.0.3",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
