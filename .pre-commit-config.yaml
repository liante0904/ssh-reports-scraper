repos:
  - repo: local
    hooks:
      - id: check-url-leaks
        name: Check staged URL leaks
        entry: python3 scripts/check_url_leaks.py
        language: system
        pass_filenames: false
      - id: verify-dockerfile
        name: Verify Dockerfile COPY
        entry: bash scripts/verify_dockerfile.sh
        language: system
        pass_filenames: false
        stages: [pre-push]
      - id: verify-standalones
        name: Verify GA standalone syntax
        entry: bash scripts/verify_standalones.sh
        language: system
        pass_filenames: false
        stages: [pre-push]
