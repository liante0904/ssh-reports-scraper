    server_module: modules.ShinHanInvest_1
    workflow_path: .github/workflows/scrape-shinhan.yml
    env_var: SHINHAN_URLS_JSON
    result_file: shinhan_result.json
    config_shape: full_config
    empty_policy: require_non_empty
    server_list: async
    ga_full_scrape_list: none
    ga_fallback_excluded: false
    ga_fallback_exclusion_reason: ~
    func_name: "ShinHanInvest_checkNewArticle"
    enricher: null
    enrichment_skip: false
    special_funcs: null
    notes: "서버 전용 (GA standalone 미해당). SyncWebScraper + aiohttp 직접 사용 혼합. env 이름으로 SHINHAN_URLS_JSON 사용."

