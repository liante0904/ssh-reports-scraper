# Firm Manifest — SSoT for ssh-reports-scraper
# =============================================
# 각 증권사별 흩어진 정보(core, standalone, module, workflow, env, result file)를
# 단일 manifest로 통합한다.
#
# Schema:
#   firms:
#     {key}:
#       display_name: str       # 한글 증권사명
#       firm_id: int            # DB firm_id (tbl_sec_reports.firm_id)
#       mode: str               # ga | server | dual | ga_disabled | blocked
#       core_module: str|null   # e.g. "scrapers.kb_core" or null
#       standalone_path: str|null  # e.g. "run/standalone/kb.py" or null
#       server_module: str      # e.g. "modules.KBsec_4"
#       workflow_path: str|null # e.g. ".github/workflows/scrape-kb.yml" or null
#       env_var: str|null       # workflow/standalone env 변수명 (e.g. "KB_URLS_JSON" or "urls")
#       result_file: str        # JSON 결과 파일명
#       config_shape: str       # url_list | full_config
#       empty_policy: str       # require_non_empty | allow_empty | server_only
#       notes: str              # 예외 사항
#       # Dispatch fields (for scraper_registry.py):
#       server_list: str        # sync | async | none — local scheduler function list
#       ga_full_scrape_list: str  # sync | async | none — GA fallback in full-scrape mode
#       ga_fallback_excluded: bool  # true if excluded from full-scrape despite GA mode
#       ga_fallback_exclusion_reason: str|null  # why excluded (if applicable)
#       func_name: str             # explicit function name (e.g. "KB_checkNewArticle")
#       enricher: str|null         # "module.path:func_name" or null
#       enrichment_skip: bool      # true to skip enrichment for this firm
#       special_funcs: dict|null   # {"name": "module.path:func"} or null

firms:
  # =========================================================================
