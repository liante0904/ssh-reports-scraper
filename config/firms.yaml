# Firm Manifest — SSoT for ssh-reports-scraper
# =============================================
# 각 증권사별 흩어진 정보(core, standalone, module, workflow, env, result file)를
# 단일 manifest로 통합한다.
#
# Schema:
#   firms:
#     {key}:
#       display_name: str       # 한글 증권사명
#       firm_id: int     # DB firm_id
#       mode: str               # ga | server | dual | ga_disabled | blocked
#       core_module: str|null   # e.g. "scrapers.kb_core" or null
#       standalone_path: str|null  # e.g. "run/standalone/kb.py" or null
#       server_module: str      # e.g. "modules.KBsec_4"
#       workflow_path: str|null # e.g. ".github/workflows/scrape-kb.yml" or null
#       env_var: str|null       # workflow env 변수명 (e.g. "KB_URLS_JSON" or "urls")
#       result_file: str        # JSON 결과 파일명
#       config_shape: str       # url_list | full_config
#       empty_policy: str       # require_non_empty | allow_empty | server_only
#       notes: str              # 예외 사항
#
# 현재 대표/저위험 15개 firm 입력. 나머지는 evidence 검토 후 5개 단위로 추가 예정.

firms:
  # --- 정규 GA dual 패턴 (GA + server fallback) ---
  kb:
    display_name: KB증권
    firm_id: 4
    mode: dual
    core_module: scrapers.kb_core
    standalone_path: run/standalone/kb.py
    server_module: modules.KBsec_4
    workflow_path: .github/workflows/scrape-kb.yml
    env_var: KB_URLS_JSON
    result_file: kb_result.json
    config_shape: full_config
    empty_policy: require_non_empty
    notes: "13종 게시판 분류(pCategoryId). _runner.py 정규 패턴."

  # --- GA disabled + server fallback ---
  hana:
    display_name: 하나증권
    firm_id: 3
    mode: ga_disabled
    core_module: scrapers.hana_core
    standalone_path: run/standalone/hana.py
    server_module: modules.HANA_3
    workflow_path: .github/workflows/scrape-hana.yml
    env_var: HANA_URLS_JSON
    result_file: hana_result.json
    config_shape: full_config
    empty_policy: require_non_empty
    notes: "GA 러너 IP(미국/유럽) 차단으로 schedule 비활성화(2026-06-22). 서버 scheduler가 직접 스크래핑. _runner.py 정규 패턴."

  # --- LS 특수 패턴 (DB + WARP + 복수 standalone) ---
  ls:
    display_name: LS증권
    firm_id: 0
    mode: ga
    core_module: null
    standalone_path: run/standalone/ls.py
    server_module: modules.LS_0
    workflow_path: .github/workflows/scrape-ls.yml
    env_var: urls
    result_file: ls_result.json
    config_shape: url_list
    empty_policy: require_non_empty
    notes: "DB 의존(FirmInfo, get_db), WARP 프록시(SOCKS_PROXY), 전역 상태(skip_boards, USE_WARP_ONLY). _runner.py 미사용 — modules/LS_0.py의 LS_checkNewArticle() 직접 호출. v2 standalone(ls_v2.py)+workflow(scrape-ls-v2.yml)+scripts/standalone_ls_scraper.py 별도 존재."

  # --- Selenium + non-core 패턴 ---
  koreainvestment:
    display_name: 한국투자증권
    firm_id
    mode: ga
    core_module: null
    standalone_path: run/standalone/koreainvestment.py
    server_module: modules.Koreainvestment_13
    workflow_path: .github/workflows/scrape-koreainvestment.yml
    env_var: urls
    result_file: ki_result.json
    config_shape: url_list
    empty_policy: require_non_empty
    notes: "Selenium 의존(browser-actions/setup-chrome@v1). ChromeDriver ARM64/amd64 분기. _runner.py 미사용 — modules/Koreainvestment_13.py의 selenium 함수 직접 호출. core 정규 패턴(scrapers/koreainvestment_core.py) 미이관."

  # --- IP 차단 / 비정규 standalone ---
  bnk:
    display_name: BNK투자증권
    firm_id
    mode: blocked
    core_module: null
    standalone_path: null
    server_module: modules.BNKfn_23
    workflow_path: .github/workflows/scrape-bnk.yml
    env_var: null
    result_file: /tmp/bnk_result.json
    config_shape: url_list
    empty_policy: allow_empty
    notes: "IP 차단(BLOCKED_BY_SOURCE_IP). GA schedule + local scheduler auto-call both disabled (2026-06-26). workflow_dispatch + manual diagnostic only. run/standalone/bnk.py 없음 — scripts/standalone_bnk_scraper.py 사용. SCP 대신 artifact 업로드 방식. Colab/external IP로 수동 진단 가능."

