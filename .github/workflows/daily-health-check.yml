name: Daily Scraper Health Check (Import Only)

on:
  schedule:
    # 한국 시간(KST) 오전 6시는 UTC 기준 오후 9시 (전날)
    - cron: '0 21 * * *'
  workflow_dispatch:

jobs:
  health-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh

      - name: Install dependencies
        run: uv sync

      - name: Run Import & Syntax Tests (no network)
        run: |
          uv run pytest tests/test_scraper_imports.py -v
          uv run pytest tests/test_config_manager.py -v -q

      - name: Notify OCI Watchdog
        if: failure()
        run: |
          echo "GA import tests failed. Watchdog will detect via log monitoring."
