name: tmp-dump-heungkuk
on: [workflow_dispatch]
jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      - run: echo "$HEUNGKUK_URLS_JSON" | base64 > /tmp/cfg.b64
        env:
          HEUNGKUK_URLS_JSON: ${{ secrets.HEUNGKUK_URLS_JSON }}
      - uses: actions/upload-artifact@v4
        with:
          name: heungkuk-cfg
          path: /tmp/cfg.b64
