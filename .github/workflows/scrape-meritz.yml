name: Meritz Scraper → SCP (DISABLED — GA IP 차단, 2026-06-23)
on:
  workflow_dispatch:
jobs:
  scrape-and-scp:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: pip install uv
      - run: uv sync --frozen --no-cache
      - name: Run scraper
        env:
          MERITZ_URLS_JSON: ${{ secrets.MERITZ_URLS_JSON }}
        run: |
          uv run python run/standalone/meritz.py > meritz_result.json 2>meritz_log.txt
          cat meritz_log.txt
          COUNT=$(python3 -c "import json; print(len(json.load(open('meritz_result.json'))))")
          echo "Articles collected: $COUNT"
      - name: Validate result
        run: |
          python scripts/validate_scrape_result.py meritz_result.json --require-non-empty
      - name: SCP
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.SERVER_HOST }} >> ~/.ssh/known_hosts
          scp -P ${{ secrets.SERVER_PORT || 22 }} meritz_result.json ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:incoming/ga-scrapes/
