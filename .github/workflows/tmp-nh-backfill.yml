name: tmp-nh-backfill
on: [workflow_dispatch]
jobs:
  backfill:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install uv
      - run: uv sync --frozen --no-cache
      - name: Run NH scraper for missing dates
        env:
          NHQV_URLS_JSON: ${{ secrets.NHQV_URLS_JSON }}
        run: |
          for d in 20260603 20260604 20260605 20260618; do
            echo "=== $d ==="
            uv run python -c "
import json, os, sys
sys.path.insert(0, '.')
from scrapers.nhqv_core import scrape_nhqv
cfg = json.loads(os.environ['NHQV_URLS_JSON'])
result = scrape_nhqv(cfg, target_date='$d')
print(f'$d: {len(result)} articles')
json.dump(result, open(f'nhqv_${d}.json', 'w'), ensure_ascii=False)
"
          done
          ls -la nhqv_*.json
      - uses: actions/upload-artifact@v4
        with:
          name: nh-data
          path: nhqv_*.json
