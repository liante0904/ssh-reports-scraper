name: NH Backfill
on:
  workflow_dispatch:
jobs:
  backfill:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install uv
      - run: uv sync --frozen --no-cache
      - name: Scrape missing dates
        env:
          NHQV_URLS_JSON: ${{ secrets.NHQV_URLS_JSON }}
        run: |
          for d in 20260603 20260604 20260605 20260618; do
            uv run python -c "
import json,os,sys
sys.path.insert(0,'.')
from scrapers.nhqv_core import scrape_nhqv
r=scrape_nhqv(json.loads(os.environ['NHQV_URLS_JSON']),target_date='$d')
print(f'$d: {len(r)} articles')
json.dump(r,open(f'nhqv_$d.json','w'),ensure_ascii=False)
"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: nh-backfill
          path: nhqv_*.json
