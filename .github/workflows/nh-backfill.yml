name: NH Backfill
on:
  workflow_dispatch:
jobs:
  backfill:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install uv
      - run: uv sync --frozen --no-cache
      - name: Scrape all dates
        env:
          NHQV_URLS_JSON: ${{ secrets.NHQV_URLS_JSON }}
        run: |
          for d in 20260603 20260604 20260605 20260618; do
            uv run python run/standalone/nhqv.py $d > nhqv_$d.json 2>nhqv_$d.log
            echo "$d: $(python3 -c \"import json; print(len(json.load(open('nhqv_$d.json'))))\") articles"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: nh-data
          path: nhqv_*.json
