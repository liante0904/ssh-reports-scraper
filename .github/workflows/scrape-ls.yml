name: LS Scraper → SCP
on:
  schedule:
    - cron: '0 0-10,15-23 * * 1-5'
    - cron: '30 11-14 * * 1-5'
  workflow_dispatch:
jobs:
  scrape-and-scp:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: pip install uv
      - run: uv sync --frozen --no-cache
      - name: Run LS scraper
        env:
          urls: ${{ secrets.LS_URLS_JSON }}
          DB_BACKEND: sqlite
        run: |
          uv run python run/standalone/ls.py > ls_result.json 2>ls_log.txt || (echo "=== Scraper Log ===" && cat ls_log.txt && exit 1)
          echo "=== Scraper Log ==="
          cat ls_log.txt
          COUNT=$(python3 -c "import json; print(len(json.load(open('ls_result.json'))))")
          echo "Articles collected: $COUNT"
      - name: Validate result
        run: python scripts/validate_scrape_result.py ls_result.json --require-non-empty
      - name: SCP to server
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.SERVER_HOST }} >> ~/.ssh/known_hosts
          scp -P ${{ secrets.SERVER_PORT || 22 }} ls_result.json ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:incoming/ga-scrapes/
          echo "SCP transfer complete"
