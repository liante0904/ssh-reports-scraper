name: Deterministic Tests

env:
  SSH_LIBRARY_ENABLED: ${{ secrets.SSH_LIBRARY_DEPLOY_KEY != '' }}

on:
  pull_request:
  push:
    branches-ignore:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare optional vendor context
        run: mkdir -p vendor/ssh_library

      - name: Checkout private ssh-library
        if: ${{ env.SSH_LIBRARY_ENABLED == 'true' }}
        uses: actions/checkout@v4
        with:
          repository: liante0904/ssh-library
          path: vendor/ssh_library
          ssh-key: ${{ secrets.SSH_LIBRARY_DEPLOY_KEY }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run deterministic regression gate
        run: bash scripts/verify_ci.sh
