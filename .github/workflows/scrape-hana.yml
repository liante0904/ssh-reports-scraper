name: Hana Scraper → SCP (DISABLED — GA 러너 IP 차단, 2026-06-22)
on:
  # schedule 제거: GA 러너(미국/유럽)에서 www.hanaw.com 접근 불가
  # 서버 scheduler.py에서 직접 스크래핑 (modules/HANA_3.py → scrapers/hana_core.py)
  workflow_dispatch:
jobs:
  scrape-and-scp:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: pip install uv
      - run: uv sync --frozen --no-cache
      - name: Run scraper
        env:
          HANA_URLS_JSON: ${{ secrets.HANA_URLS_JSON }}
        run: |
          uv run python run/standalone/hana.py > hana_result.json 2>hana_log.txt
          cat hana_log.txt
          COUNT=$(python3 -c "import json; print(len(json.load(open('hana_result.json'))))")
          echo "Articles collected: $COUNT"
      - name: Validate result
        run: |
          python scripts/validate_scrape_result.py hana_result.json 
      - name: SCP
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.SERVER_HOST }} >> ~/.ssh/known_hosts
          scp -P ${{ secrets.SERVER_PORT || 22 }} hana_result.json ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:incoming/ga-scrapes/
