name: Sangsangin Scraper → SCP

on:
  schedule:
    # KST 월요일 07~08시 10분 간격
    - cron: '*/10 22 * * 0'
    - cron: '0 23 * * 0'
    # KST 월~금 전일 매시간 (KST 20-23시는 :30분 오프셋)
    - cron: '0 0-10,15-23 * * 1-5'
    - cron: '30 11-14 * * 1-5'
  workflow_dispatch:

jobs:
  scrape-and-scp:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        run: pip install uv

      - name: Install deps
        run: uv sync --frozen --no-cache

      - name: Run Sangsangin scraper
        env:
          SANGSANGINIB_URLS_JSON: ${{ secrets.SANGSANGINIB_URLS_JSON }}
        run: |
          uv run python run/standalone/sangsanginib.py > sangsanginib_result.json 2>sangsanginib_log.txt
          echo "=== Scraper Log ==="
          cat sangsanginib_log.txt
          COUNT=$(python3 -c "import json; print(len(json.load(open('sangsanginib_result.json'))))")
          echo "Articles collected: $COUNT"

      - name: Validate result
        run: |
          uv run python scripts/validate_scrape_result.py sangsanginib_result.json --require-non-empty
      - name: SCP to server
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.SERVER_HOST }} >> ~/.ssh/known_hosts
          scp -P ${{ secrets.SERVER_PORT || 22 }} sangsanginib_result.json ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:incoming/ga-scrapes/
          echo "SCP transfer complete"
