name: Naver/Chosun News Scraper → SCP

on:
  schedule:
    # 5분 간격 실행
    - cron: '*/5 * * * *'
    
  workflow_dispatch:

jobs:
  scrape-and-scp:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        run: pip install uv

      - name: Install deps
        run: uv sync --frozen --no-cache

      - name: Run News scraper
        run: |
          uv run python run/standalone/news.py > news_result.json 2>news_log.txt
          echo "=== Scraper Log ==="
          cat news_log.txt
          COUNT=$(python3 -c "import json; print(len(json.load(open('news_result.json'))))")
          echo "Articles collected: $COUNT"

      - name: Validate result
        run: |
          python scripts/validate_scrape_result.py news_result.json --require-non-empty

      - name: SCP to server
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.SERVER_HOST }} >> ~/.ssh/known_hosts
          scp -P ${{ secrets.SERVER_PORT || 22 }} news_result.json ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:incoming/ga-scrapes/
          echo "SCP transfer complete"
